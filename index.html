<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>myDrugs</title>

    <link rel="shortcut icon" href href="/assets/images/logo/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay" data-overlay></div>


    <div class="modal" data-modal>

        <div class="modal-close-overlay" data-modal-overlay></div>

        <div class="modal-content">

            <button class="modal-close-btn" data-modal-close>

                <ion-icon name="close-outline"></ion-icon>

            </button>

            <div class="newsletter-img">

                <img src="./assets/images/newsletter.png" alt="subscribe NewsLetter" width="400"
                height="400">

            </div>

            <div class="newsletter">

                <form action="#">

                    <div class="newsletter-header">

                        <h3 class="newsletter-title">Subscribe to our Newsletter</h3>

                        <p class="newsletter-desc">Subscribe the        <b>myDrugs</b> to get latest products and discounts update</p>

                    </div>

                    <input type="email" name="email" id="" class="email-field" placeholder="enter a vald email addre" required>

                    <button type="submit" class="btn-newsletter">Subscribe</button>

                </form>
            </div>
        </div>
    </div>

    <div class="notification-toast  closed" data-toast>

        <button class="toast-close-btn" data-toast-close>

            <ion-icon name="close-outline"></ion-icon>

        </button>

        <div class="toast-banner">

            <img src="./assets/images/products/jewellery-1.jpg" alt="Rose gold earings
            " width="80" height="80">

        </div>

        <div class="toast-detail">

            <p class="toast-message">
                Someone in new just bought
            </p>

            <p class="toast-title">
                Rose Gold Earings
            </p>

            <p class="toast-meta">
                <time datetime="PT2M">2 Minutes</time> ago
            </p>

        </div>

    </div>


    <header>

        <div class="header-top">

            <div class="container">

                <ul class="header-social-container">

                    <li>
                        <a href="#" class="social-link">
                            <ion-icon name="logo-facebook"></ion-icon>
                        </a>
                    </li>

                    <li>
                        <a href="#" class="social-link">
                            <ion-icon name="logo-facebook"></ion-icon>
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </header>











    <script src="/assets/js/script.js"></script>  

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
